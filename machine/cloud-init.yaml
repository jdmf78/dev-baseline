#cloud-config
# Provision a new Ubuntu VM with the same setup as your current server.
# Paste as "user data" when creating the VM. Replace the two placeholders:
# your laptop's public key, and YOUR_USERNAME/YOUR_PROJECT (your product's
# GitHub repo; see "what --project means" in the README).
users:
  - name: dev
    groups: [sudo]
    shell: /bin/bash
    # Passwordless sudo lets bootstrap run unattended. Agents are denied sudo
    # in ~/.claude/settings.json; set a password and remove this line if you
    # want a hard barrier.
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAA_REPLACE_WITH_YOUR_LAPTOP_PUBLIC_KEY you@laptop

ssh_pwauth: false
disable_root: true
package_update: true
package_upgrade: true
packages: [git, curl]

# Clones the kit and runs the unattended part; output goes to
# /home/dev/bootstrap.log. Then SSH in as dev and run, in order:
#   ~/dev-baseline/machine/login.sh     (sign-ins and your project)
#   exec bash -l                        (load the new shell setup)
# Using a private fork of the kit? Delete runcmd, scp the kit over, run bootstrap.sh.
runcmd:
  - >-
    sudo -u dev -H bash -lc 'git clone https://github.com/jdmf78/dev-baseline.git ~/dev-baseline
    && ~/dev-baseline/machine/bootstrap.sh --harden --project YOUR_USERNAME/YOUR_PROJECT
    > ~/bootstrap.log 2>&1'
